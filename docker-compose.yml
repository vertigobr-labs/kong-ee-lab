#
# Kong Gateway (OSS) com database Postgres.
#
# COMO USAR:
#
# docker compose up -d kong-db
# docker compose up kong-init    # roda as migrations
# docker compose up -d kong
#
# Kong Gateway:   http://localhost:8000
# Kong Admin API: http://localhost:8001
# Kong Manager:   http://localhost:8002
#
# Atencao: ao subir de uma versao antiga do Postgres e preciso recriar o volume
# ("docker compose down -v"), pois os data directories nao sao compativeis.
#

services:
  kong-db:
    image: postgres:17
    environment:
      - POSTGRES_DB=kong
      - POSTGRES_USER=kong
      - POSTGRES_PASSWORD=kong
    volumes:
      - kongdb:/var/lib/postgresql/data
  kong-init:
    image: kong:3.9.3
    depends_on:
      kong-db:
        condition: service_started
    restart: on-failure
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_LOG_LEVEL: debug
    command: kong migrations bootstrap
  kong:
    image: kong:3.9.3
    depends_on:
      kong-init:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_ADMIN_GUI_API_URL: http://localhost:8001
      KONG_LOG_LEVEL: notice
    ports:
      - 8000:8000
      - 8443:8443
      - 8001:8001
      - 8444:8444
      - 8002:8002
      - 8445:8445
volumes:
  kongdb:
