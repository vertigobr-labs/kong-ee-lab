# Source: kong/templates/admission-webhook.yaml
kind: ValidatingWebhookConfiguration
apiVersion: admissionregistration.k8s.io/v1
metadata:
  name: kong-ingress-kong-validations
  namespace: andrevtg
  labels:
    app.kubernetes.io/name: kong
    # helm.sh/chart: kong-2.19.0
    # app.kubernetes.io/instance: "kong-ingress"
    # app.kubernetes.io/managed-by: "Helm"
    # app.kubernetes.io/version: "3.2"
webhooks:
- name: validations.kong.konghq.com
  objectSelector:
    matchExpressions:
    - key: owner
      operator: NotIn
      values:
      - helm
  failurePolicy: Ignore
  sideEffects: None
  admissionReviewVersions: ["v1beta1"]
  rules:
  - apiGroups:
    - configuration.konghq.com
    apiVersions:
    - '*'
    operations:
    - CREATE
    - UPDATE
    resources:
    - kongconsumers
    - kongplugins
    - kongclusterplugins
    - kongingresses
    scope: "Namespaced"
  - apiGroups:
    - ''
    apiVersions:
    - 'v1'
    operations:
    - UPDATE
    resources:
    - secrets
    scope: "Namespaced"
  clientConfig:
    caBundle: 
    service:
      name: kong-ingress-kong-validation-webhook
      namespace: andrevtg

