#
# Cenario: banco populado pelo Kong EE 3.9 (ultima versao com "free mode") e
# depois reaproveitado por uma imagem baseada em Kong OSS 3.10 (VeeCode APIP).
#
# Ver README.md nesta pasta.
#
# As migrations do APIP rodam sozinhas, em tres servicos encadeados
# (bootstrap -> up -> finish). Os tres sao idempotentes e saem com codigo 0
# quando nao ha o que fazer, entao a cadeia serve tanto para banco novo quanto
# para banco herdado. Sao servicos separados, e nao um "sh -c", porque a imagem
# distroless nao tem shell.
#

x-db-env: &db-env
  KONG_DATABASE: postgres
  KONG_PG_HOST: kong-db
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: kong
  KONG_PG_DATABASE: kong
  KONG_LOG_LEVEL: info

x-gateway-env: &gateway-env
  <<: *db-env
  KONG_ADMIN_LISTEN: 0.0.0.0:8001
  KONG_ADMIN_GUI_URL: http://localhost:8002
  KONG_ADMIN_GUI_API_URL: http://localhost:8001
  KONG_PROXY_ACCESS_LOG: /dev/stdout
  KONG_ADMIN_ACCESS_LOG: /dev/stdout
  KONG_PROXY_ERROR_LOG: /dev/stderr
  KONG_ADMIN_ERROR_LOG: /dev/stderr

x-apip-migration: &apip-migration
  image: veecode/kong:3.10.0-veecode.10-distroless
  environment: *db-env
  restart: on-failure

services:
  kong-db:
    image: postgres:17
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kongdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- etapa 1: Kong Gateway Enterprise 3.9 em free mode ----------

  kong-ee-init:
    image: kong/kong-gateway:3.9.1.2
    depends_on:
      kong-db:
        condition: service_healthy
    restart: on-failure
    environment: *db-env
    command: kong migrations bootstrap

  kong-ee:
    image: kong/kong-gateway:3.9.1.2
    depends_on:
      kong-ee-init:
        condition: service_completed_successfully
    environment: *gateway-env
    ports:
      - 8000:8000
      - 8443:8443
      - 8001:8001
      - 8002:8002

  # ---------- etapa 2: VeeCode APIP (distroless) no mesmo banco ----------

  apip-bootstrap:
    <<: *apip-migration
    depends_on:
      kong-db:
        condition: service_healthy
    command: kong migrations bootstrap

  apip-up:
    <<: *apip-migration
    depends_on:
      apip-bootstrap:
        condition: service_completed_successfully
    command: kong migrations up

  apip-finish:
    <<: *apip-migration
    depends_on:
      apip-up:
        condition: service_completed_successfully
    command: kong migrations finish

  apip:
    image: veecode/kong:3.10.0-veecode.10-distroless
    depends_on:
      apip-finish:
        condition: service_completed_successfully
    environment: *gateway-env
    ports:
      - 8000:8000
      - 8443:8443
      - 8001:8001
      - 8002:8002

volumes:
  kongdb:
