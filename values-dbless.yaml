#
# Valores para testes em k3d local (Kong OSS, db-less / ingress controller).
#
# helm upgrade -i kong -f values-dbless.yaml kong/kong --version 3.4.1
#

image:
  repository: kong
  tag: "3.9.3"
env:
  admin_gui_api_url: "http://localhost:9000"
  admin_gui_url: "http://localhost:9001"
  proxy_url: "http://localhost:8000"
  log_level: info
ingressController:
  enabled: true
enterprise:
  enabled: false
admin:
  enabled: true
  type: NodePort
  http:
    enabled: true
    nodePort: 30000 # vkdr nodeport exposed as 9000
  tls:
    enabled: false
proxy:
  type: LoadBalancer # vkdr LB
  http:
    enabled: true
  tls:
    enabled: false
manager:
  # Enable creating a Kubernetes service for Kong Manager
  enabled: true
  type: NodePort
  http:
    enabled: true
    nodePort: 30001 # vkdr nodeport exposed as 9001
  tls:
    enabled: false
